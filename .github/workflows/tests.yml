name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-test-and-package:
    name: Windows tests and package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources
        env:
          PYTHONPATH: ""
        run: python -m compileall -q main.py server.py src usdb_importer.py

      - name: Run tests
        env:
          PYTHONPATH: ""
        run: python -m pytest -q

      - name: Build Windows executable
        env:
          PYTHONPATH: ""
        run: python -m PyInstaller --clean --noconfirm ultrastar-importer.spec

      - name: Validate and package release files
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          exe = Path("dist/UltraStarImporter.exe")
          assert exe.is_file(), "EXE fehlt"
          size = exe.stat().st_size
          assert size < 25 * 1024 * 1024, f"EXE zu groß: {size / 1024 / 1024:.2f} MiB"

          files = [
              exe,
              Path("LICENSE"),
              Path("DISCLAIMER.md"),
              Path("THIRD_PARTY_NOTICES.md"),
              Path("THIRD_PARTY_LICENSES.txt"),
          ]
          assert all(path.is_file() for path in files), "Release-Rechtstexte fehlen"

          release = Path("release")
          release.mkdir(exist_ok=True)
          archive = release / "UltraStarImporter-0.1.0-windows-x64.zip"
          with ZipFile(archive, "w", ZIP_DEFLATED) as bundle:
              for path in files:
                  bundle.write(path, path.name)

          digest = sha256(archive.read_bytes()).hexdigest()
          (release / f"{archive.name}.sha256").write_text(
              f"{digest}  {archive.name}\n", encoding="ascii"
          )
          print(f"EXE: {size / 1024 / 1024:.2f} MiB")
          print(f"ZIP SHA-256: {digest}")

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: UltraStarImporter-0.1.0-windows-x64
          path: |
            release/UltraStarImporter-0.1.0-windows-x64.zip
            release/UltraStarImporter-0.1.0-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  docker-smoke-test:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag ultrastar-importer:ci .

      - name: Verify image metadata and legal files
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' ultrastar-importer:ci)" = "app"
          docker run --rm ultrastar-importer:ci test -r /app/LICENSE
          docker run --rm ultrastar-importer:ci test -r /app/THIRD_PARTY_LICENSES.txt

      - name: Start container
        run: |
          docker run --detach --name ultrastar-importer-ci \
            --publish 127.0.0.1:5776:5776 \
            --env USDB_USERNAME=ci-user \
            --env USDB_PASSWORD=ci-password-not-a-secret \
            ultrastar-importer:ci

      - name: Check health and authentication
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5776/health > health.json; then
              break
            fi
            sleep 1
          done
          python -c 'import json; data=json.load(open("health.json")); assert data == {"ok": True, "version": "0.1.0"}, data'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5776/)" = "401"
          test "$(curl --silent --user ci-user:ci-password-not-a-secret --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5776/)" = "200"

      - name: Show container logs on failure
        if: failure()
        run: docker logs ultrastar-importer-ci

      - name: Stop container
        if: always()
        run: docker rm --force ultrastar-importer-ci || true
