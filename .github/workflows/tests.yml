name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-test-and-package:
    name: Windows tests and package
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources
        env:
          PYTHONPATH: ""
        run: python -m compileall -q main.py server.py src usdb_importer.py

      - name: Run tests
        env:
          PYTHONPATH: ""
        run: python -m pytest -q

      - name: Build Windows executable
        env:
          PYTHONPATH: ""
        run: python -m PyInstaller --clean --noconfirm ultrastar-importer.spec

      - name: Validate and package release files
        id: package
        shell: python
        run: |
          import os
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          version_scope = {}
          exec(Path("src/version.py").read_text(encoding="utf-8"), version_scope)
          version = version_scope["__version__"]

          exe = Path("dist/UltraStarImporter.exe")
          assert exe.is_file(), "EXE missing"
          size = exe.stat().st_size
          assert size < 25 * 1024 * 1024, f"EXE too large: {size / 1024 / 1024:.2f} MiB"

          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              expected_tag = f"v{version}"
              actual_tag = os.environ["GITHUB_REF_NAME"]
              assert actual_tag == expected_tag, (
                  f"Tag {actual_tag!r} does not match project version {expected_tag!r}"
              )

          files = [
              exe,
              Path("LICENSE"),
              Path("DISCLAIMER.md"),
              Path("THIRD_PARTY_NOTICES.md"),
              Path("THIRD_PARTY_LICENSES.txt"),
          ]
          assert all(path.is_file() for path in files), "Release legal files missing"

          release = Path("release")
          release.mkdir(exist_ok=True)
          artifact_name = f"UltraStarImporter-{version}-windows-x64"
          archive = release / f"{artifact_name}.zip"
          with ZipFile(archive, "w", ZIP_DEFLATED) as bundle:
              for path in files:
                  bundle.write(path, path.name)

          digest = sha256(archive.read_bytes()).hexdigest()
          (release / f"{archive.name}.sha256").write_text(
              f"{digest}  {archive.name}\n", encoding="ascii"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"artifact-name={artifact_name}", file=output)
          print(f"EXE: {size / 1024 / 1024:.2f} MiB")
          print(f"ZIP SHA-256: {digest}")

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: |
            release/${{ steps.package.outputs.artifact-name }}.zip
            release/${{ steps.package.outputs.artifact-name }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  docker-smoke-test:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read project version
        id: version
        shell: bash
        run: |
          version="$(python -c 'from src.version import __version__; print(__version__)')"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.version=${{ steps.version.outputs.value }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag ultrastar-importer:ci .

      - name: Verify image metadata and legal files
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' ultrastar-importer:ci)" = "app"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' ultrastar-importer:ci)" = "${{ steps.version.outputs.value }}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' ultrastar-importer:ci)" = "https://github.com/nschmidtdev/USDB-Importer"
          docker run --rm ultrastar-importer:ci test -r /app/LICENSE
          docker run --rm ultrastar-importer:ci test -r /app/THIRD_PARTY_LICENSES.txt

      - name: Start container
        run: |
          docker run --detach --name ultrastar-importer-ci \
            --publish 127.0.0.1:5776:5776 \
            --env USDB_USERNAME=ci-user \
            --env USDB_PASSWORD=ci-password-not-a-secret \
            ultrastar-importer:ci

      - name: Check health and authentication
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5776/health > health.json; then
              break
            fi
            sleep 1
          done
          EXPECTED_VERSION="${{ steps.version.outputs.value }}" python -c 'import json, os; data=json.load(open("health.json")); assert data == {"ok": True, "version": os.environ["EXPECTED_VERSION"]}, data'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5776/)" = "401"
          test "$(curl --silent --user ci-user:ci-password-not-a-secret --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5776/)" = "200"

      - name: Show container logs on failure
        if: failure()
        run: docker logs ultrastar-importer-ci

      - name: Stop container
        if: always()
        run: docker rm --force ultrastar-importer-ci || true

  publish-container:
    name: Publish container to GHCR
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - windows-test-and-package
      - docker-smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from src.version import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v$version"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build release image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker build --pull \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" .
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE:$VERSION")" = "app"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE:$VERSION")" = "$VERSION"
          docker run --rm "$IMAGE:$VERSION" test -r /app/LICENSE
          docker run --rm "$IMAGE:$VERSION" test -r /app/THIRD_PARTY_LICENSES.txt

      - name: Start exact release image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker run --detach --name ultrastar-importer-release \
            --publish 127.0.0.1:5776:5776 \
            --env USDB_USERNAME=ci-user \
            --env USDB_PASSWORD=ci-password-not-a-secret \
            "$IMAGE:$VERSION"

      - name: Smoke-test exact release image
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5776/health > health.json; then
              break
            fi
            sleep 1
          done
          python -c 'import json, os; data=json.load(open("health.json")); assert data == {"ok": True, "version": os.environ["EXPECTED_VERSION"]}, data'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5776/)" = "401"
          test "$(curl --silent --user ci-user:ci-password-not-a-secret --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5776/)" = "200"

      - name: Show release container logs on failure
        if: failure()
        run: docker logs ultrastar-importer-release

      - name: Stop release container
        if: always()
        run: docker rm --force ultrastar-importer-release || true

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push tested versioned and latest tags
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Log out from GitHub Container Registry
        if: always()
        run: docker logout ghcr.io || true

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - windows-test-and-package
      - docker-smoke-test
      - publish-container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-test-and-package.outputs.artifact-name }}
          path: release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f "release/${{ needs.windows-test-and-package.outputs.artifact-name }}.zip"
          test -f "release/${{ needs.windows-test-and-package.outputs.artifact-name }}.zip.sha256"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
